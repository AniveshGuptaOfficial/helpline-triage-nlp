<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1160" width="100%" height="100%" style="background:#070b14; border-radius:14px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Markers for Flowchart Arrows -->
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="1 1, 8 4.5, 1 8" fill="#38bdf8"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="1 1, 8 4.5, 1 8" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="1 1, 8 4.5, 1 8" fill="#10b981"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="1 1, 8 4.5, 1 8" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="1 1, 8 4.5, 1 8" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="1 1, 8 4.5, 1 8" fill="#c084fc"/>
    </marker>
  </defs>

  <style>
    @keyframes dashMove {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashMove 1.2s linear infinite;
    }
    .retriage-line {
      stroke-dasharray: 4 4;
      animation: dashMove 1.6s linear infinite;
    }
  </style>

  <!-- Flowchart Canvas Background -->
  <rect x="0" y="0" width="960" height="1160" fill="#070b14"/>

  <!-- ==================== FLOWCHART HEADER ==================== -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="880" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="22" cy="21" r="5" fill="#38bdf8"/>
    <text x="38" y="26" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">SYSTEM FLOWCHART &amp; STATE TRANSITION ARCHITECTURE</text>
    <text x="590" y="26" font-size="11" fill="#64748b">Vaidyum Intent-Routed Helpline</text>
  </g>

  <!-- ==================== 1. START TERMINAL ==================== -->
  <!-- Stadium / Oval: Start State -->
  <g transform="translate(320, 85)">
    <rect x="0" y="0" width="320" height="52" rx="26" fill="#0c253d" stroke="#38bdf8" stroke-width="2"/>
    <text x="160" y="24" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">STATE 0: USER QUERY INPUT</text>
    <text x="160" y="40" font-size="11" fill="#94a3b8" text-anchor="middle">Voice Audio (STT) or Text in 5 Languages</text>
  </g>

  <!-- Transition 0 -> 1 -->
  <line x1="480" y1="137" x2="480" y2="175" stroke="#38bdf8" stroke-width="2" class="flow-line" marker-end="url(#flowArrow)"/>

  <!-- ==================== 2. MOBILE INGESTION PROCESS ==================== -->
  <!-- Process Box: Mobile Client -->
  <g transform="translate(260, 175)">
    <rect x="0" y="0" width="440" height="64" rx="8" fill="#0e1b30" stroke="#0284c7" stroke-width="1.8"/>
    <text x="220" y="25" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">PROCESS: Mobile Client Ingestion (Flutter)</text>
    <text x="220" y="46" font-size="11" fill="#94a3b8" text-anchor="middle">Firebase Session Auth • Speech-to-Text • GPS Location Stream</text>
  </g>

  <!-- Transition 1 -> 2 (with payload label) -->
  <line x1="480" y1="239" x2="480" y2="295" stroke="#38bdf8" stroke-width="2" class="flow-line" marker-end="url(#flowArrow)"/>
  <g transform="translate(385, 252)">
    <rect x="0" y="0" width="190" height="22" rx="11" fill="#07192b" stroke="#0284c7" stroke-width="1"/>
    <text x="95" y="15" font-size="10" font-weight="600" fill="#7dd3fc" text-anchor="middle">HTTP POST /predict, /chat</text>
  </g>

  <!-- ==================== 3. BACKEND & TRANSLATION PROCESS ==================== -->
  <g transform="translate(240, 295)">
    <rect x="0" y="0" width="480" height="64" rx="8" fill="#07221b" stroke="#10b981" stroke-width="1.8"/>
    <text x="240" y="25" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">PROCESS: Language Normalization &amp; Translation</text>
    <text x="240" y="46" font-size="11" fill="#94a3b8" text-anchor="middle">Translates HI / TA / TE / MR ➔ English for standardized triage</text>
  </g>

  <!-- Transition 2 -> Decision -->
  <line x1="480" y1="359" x2="480" y2="400" stroke="#c084fc" stroke-width="2" class="flow-line" marker-end="url(#arrowPurple)"/>

  <!-- ==================== 4. DECISION DIAMOND: DISTILBERT ==================== -->
  <g transform="translate(480, 470)">
    <!-- Decision Diamond: Center at (480, 470), Half-width 170, Half-height 65 -->
    <polygon points="0 -65, 170 0, 0 65, -170 0" fill="#201038" stroke="#a855f7" stroke-width="2.2"/>
    <text x="0" y="-12" font-size="12" font-weight="800" fill="#f3e8ff" text-anchor="middle">DECISION / CLASSIFIER</text>
    <text x="0" y="6" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">DistilBERT 3-Way Triage</text>
    <text x="0" y="24" font-size="10" fill="#cbd5e1" text-anchor="middle">Detect Urgency First (95% Accuracy)</text>
  </g>

  <!-- ==================== 3 STATE TRANSITION BRANCHES ==================== -->
  
  <!-- Branch 1: Left ➔ State: Emergency -->
  <path d="M310 470 L 160 470 L 160 565" fill="none" stroke="#ef4444" stroke-width="2" class="flow-line" marker-end="url(#arrowRed)"/>
  <!-- Branch 1 Transition Label -->
  <g transform="translate(145, 485)">
    <rect x="0" y="0" width="135" height="24" rx="4" fill="#300d11" stroke="#ef4444" stroke-width="1"/>
    <text x="67" y="16" font-size="10" font-weight="700" fill="#fca5a5" text-anchor="middle">State: EMERGENCY</text>
  </g>

  <!-- Branch 2: Center ➔ State: Medicine Query -->
  <line x1="480" y1="535" x2="480" y2="565" stroke="#10b981" stroke-width="2" class="flow-line" marker-end="url(#arrowGreen)"/>
  <!-- Branch 2 Transition Label -->
  <g transform="translate(412, 540)">
    <rect x="0" y="0" width="135" height="22" rx="4" fill="#082b1d" stroke="#10b981" stroke-width="1"/>
    <text x="67" y="15" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">State: MEDICINE</text>
  </g>

  <!-- Branch 3: Right ➔ State: Appointment -->
  <path d="M650 470 L 800 470 L 800 565" fill="none" stroke="#3b82f6" stroke-width="2" class="flow-line" marker-end="url(#arrowBlue)"/>
  <!-- Branch 3 Transition Label -->
  <g transform="translate(680, 485)">
    <rect x="0" y="0" width="145" height="24" rx="4" fill="#0c2142" stroke="#3b82f6" stroke-width="1"/>
    <text x="72" y="16" font-size="10" font-weight="700" fill="#93c5fd" text-anchor="middle">State: APPOINTMENT</text>
  </g>

  <!-- ==================== 5. THE 3 TRIAGE STATE NODES ==================== -->

  <!-- STATE A: EMERGENCY -->
  <g transform="translate(30, 568)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="#200a0d" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="30" rx="10" fill="#380d13"/>
    <rect x="0" y="18" width="260" height="12" fill="#380d13"/>
    <circle cx="16" cy="15" r="4" fill="#ef4444"/>
    <text x="26" y="19" font-size="12" font-weight="800" fill="#fca5a5">STATE: EMERGENCY</text>
    
    <g transform="translate(14, 46)">
      <text x="0" y="12" font-size="11" font-weight="700" fill="#f87171">• Fear/Distress Scoring</text>
      <text x="10" y="27" font-size="10" fill="#94a3b8">DistilRoBERTa metric (0.0-1.0)</text>

      <text x="0" y="47" font-size="11" font-weight="700" fill="#f87171">• High Distress Flag</text>
      <text x="10" y="62" font-size="10" fill="#94a3b8">Direct 108 ambulance trigger</text>

      <text x="0" y="82" font-size="11" font-weight="700" fill="#f87171">• Hospital Locator</text>
      <text x="10" y="97" font-size="10" fill="#94a3b8">Overpass OSM 8-mi (~13km)</text>
    </g>
  </g>

  <!-- STATE B: MEDICINE QUERY -->
  <g transform="translate(350, 568)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="#061c14" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="30" rx="10" fill="#082b1d"/>
    <rect x="0" y="18" width="260" height="12" fill="#082b1d"/>
    <circle cx="16" cy="15" r="4" fill="#10b981"/>
    <text x="26" y="19" font-size="12" font-weight="800" fill="#6ee7b7">STATE: MEDICINE QUERY</text>
    
    <g transform="translate(14, 46)">
      <text x="0" y="12" font-size="11" font-weight="700" fill="#34d399">• 699 Verified Medicines</text>
      <text x="10" y="27" font-size="10" fill="#94a3b8">Symptom &amp; drug fuzzy indexing</text>

      <text x="0" y="47" font-size="11" font-weight="700" fill="#34d399">• Grounding Injection (RAG)</text>
      <text x="10" y="62" font-size="10" fill="#94a3b8">Strict indications &amp; side effects</text>

      <text x="0" y="82" font-size="11" font-weight="700" fill="#34d399">• Anti-Hallucination Guard</text>
      <text x="10" y="97" font-size="10" fill="#94a3b8">Suppresses speculative dosage</text>
    </g>
  </g>

  <!-- STATE C: APPOINTMENT -->
  <g transform="translate(670, 568)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="#081830" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="30" rx="10" fill="#0c2447"/>
    <rect x="0" y="18" width="260" height="12" fill="#0c2447"/>
    <circle cx="16" cy="15" r="4" fill="#3b82f6"/>
    <text x="26" y="19" font-size="12" font-weight="800" fill="#93c5fd">STATE: APPOINTMENT</text>
    
    <g transform="translate(14, 46)">
      <text x="0" y="12" font-size="11" font-weight="700" fill="#60a5fa">• 10 Clinical Departments</text>
      <text x="10" y="27" font-size="10" fill="#94a3b8">Specialty symptom match via LLM</text>

      <text x="0" y="47" font-size="11" font-weight="700" fill="#60a5fa">• Safe Fallback Logic</text>
      <text x="10" y="62" font-size="10" fill="#94a3b8">Defaults to General Medicine</text>

      <text x="0" y="82" font-size="11" font-weight="700" fill="#60a5fa">• Nearby Clinic Locator</text>
      <text x="10" y="97" font-size="10" fill="#94a3b8">Overpass OSM facility match</text>
    </g>
  </g>

  <!-- ==================== DYNAMIC RE-TRIAGE TRANSITIONS ==================== -->
  <!-- Dotted Re-Triage from Medicine to Emergency -->
  <path d="M350 635 C 320 635, 305 635, 290 635" fill="none" stroke="#f87171" stroke-width="2" class="retriage-line" marker-end="url(#arrowRed)"/>
  
  <!-- Dotted Re-Triage from Appointment to Emergency (Arc across bottom) -->
  <path d="M800 718 C 800 760, 160 760, 160 722" fill="none" stroke="#f87171" stroke-width="1.8" class="retriage-line" marker-end="url(#arrowRed)"/>
  <g transform="translate(360, 746)">
    <rect x="0" y="0" width="240" height="20" rx="4" fill="#2b0a0e" stroke="#ef4444" stroke-width="1"/>
    <text x="120" y="14" font-size="10" font-weight="700" fill="#fca5a5" text-anchor="middle">↺ DYNAMIC MID-THREAD RE-TRIAGE</text>
  </g>

  <!-- ==================== CONVERGENCE TO LLM ==================== -->
  <path d="M160 720 L 160 805 L 360 805" fill="none" stroke="#ef4444" stroke-width="2" class="flow-line"/>
  <line x1="480" y1="720" x2="480" y2="805" stroke="#10b981" stroke-width="2" class="flow-line"/>
  <path d="M800 720 L 800 805 L 600 805" fill="none" stroke="#3b82f6" stroke-width="2" class="flow-line"/>
  <line x1="480" y1="805" x2="480" y2="835" stroke="#f59e0b" stroke-width="2.5" class="flow-line" marker-end="url(#arrowAmber)"/>

  <!-- ==================== 6. LLM GENERATION PROCESS ==================== -->
  <g transform="translate(200, 836)">
    <rect x="0" y="0" width="560" height="90" rx="10" fill="#261608" stroke="#f59e0b" stroke-width="2"/>
    <text x="280" y="26" font-size="13" font-weight="800" fill="#fde68a" text-anchor="middle">PROCESS: Category-Conditioned LLM Generation</text>
    <text x="280" y="44" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Google Gemini Flash Lite + Dedicated Prompts</text>
    <text x="280" y="64" font-size="11" fill="#cbd5e1" text-anchor="middle">• Directive Brevity (Emergency) • Grounded RAG (Drugs) • Clinic Prep (Appt)</text>
    <text x="280" y="80" font-size="10" fill="#94a3b8" text-anchor="middle">Safety Nets: Acute SOS Keyword Override &amp; Symptom Deterioration Escalation</text>
  </g>

  <!-- Transition LLM -> Final State -->
  <line x1="480" y1="926" x2="480" y2="975" stroke="#38bdf8" stroke-width="2" class="flow-line" marker-end="url(#flowArrow)"/>

  <!-- ==================== 7. TERMINAL STATE: RESPONSE DISPATCH ==================== -->
  <g transform="translate(220, 975)">
    <rect x="0" y="0" width="520" height="110" rx="28" fill="#08222b" stroke="#06b6d4" stroke-width="2"/>
    <text x="260" y="28" font-size="13" font-weight="800" fill="#67e8f9" text-anchor="middle">TERMINAL STATE: MULTI-MODAL ACTION DISPATCH</text>
    <text x="260" y="52" font-size="11" fill="#e2e8f0" text-anchor="middle">📢 Voice Audio TTS &amp; Regional Translated Text Response</text>
    <text x="260" y="70" font-size="11" fill="#e2e8f0" text-anchor="middle">🗺️ Static Map Preview &amp; Turn-by-Turn Google Maps Navigation Deep-Link</text>
    <text x="260" y="88" font-size="11" fill="#e2e8f0" text-anchor="middle">🚨 High-Distress Emergency Banner &amp; One-Tap 108 Ambulance Dial</text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(40, 1120)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="20" font-size="11" fill="#64748b">Vaidyum System Architecture • State Transition &amp; Flowchart Specification</text>
    <text x="690" y="20" font-size="11" font-weight="600" fill="#38bdf8">UML Flowchart Standard</text>
  </g>
</svg>
