<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaidyum - Animated System Architecture</title>
  <style>
    :root {
      --bg: #070b14;
      --card-bg: #0f172a;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 1140px;
      width: 100%;
    }

    /* Top Control Bar */
    .toolbar {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sim-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-emergency {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }
    .btn-emergency:hover, .btn-emergency.active {
      background: #ef4444;
      color: #fff;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.6);
    }

    .btn-medicine {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.4);
    }
    .btn-medicine:hover, .btn-medicine.active {
      background: #10b981;
      color: #fff;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
    }

    .btn-appointment {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border-color: rgba(59, 130, 246, 0.4);
    }
    .btn-appointment:hover, .btn-appointment.active {
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.6);
    }

    .btn-reset {
      background: rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
      border-color: rgba(148, 163, 184, 0.3);
    }
    .btn-reset:hover {
      background: rgba(148, 163, 184, 0.25);
    }

    /* Live Simulation Inspector Console */
    .inspector-panel {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.3s;
    }

    .inspector-header {
      display: flex;
      justify-content: space-between;
      color: #64748b;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .inspector-content {
      color: #38bdf8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* SVG Diagram Frame */
    .diagram-wrapper {
      background: #070b14;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      width: 100%;
    }

    .diagram-wrapper img, .diagram-wrapper object {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header & Interactive Simulation Bar -->
    <div class="toolbar">
      <div class="title-group">
        <h1>
          <span>⚡ Vaidyum Architecture</span>
          <span style="font-size: 0.65rem; background: #064e3b; color: #6ee7b7; padding: 2px 8px; border-radius: 20px; border: 1px solid #10b981;">LIVE SVG</span>
        </h1>
        <p>Interactive End-to-End Intent Triage &amp; Clinical Pipeline</p>
      </div>

      <div class="btn-group">
        <button class="sim-btn btn-emergency" onclick="simulateRoute('emergency')">
          🚨 Test Emergency Path
        </button>
        <button class="sim-btn btn-medicine" onclick="simulateRoute('medicine')">
          💊 Test Medicine RAG
        </button>
        <button class="sim-btn btn-appointment" onclick="simulateRoute('appointment')">
          📅 Test Appointment
        </button>
        <button class="sim-btn btn-reset" onclick="simulateRoute('reset')">
          ↺ Reset Inspector
        </button>
      </div>
    </div>

    <!-- Live Simulation Inspector -->
    <div class="inspector-panel" id="inspector">
      <div class="inspector-header">
        <span>Triage Inspector &amp; Payload Telemetry</span>
        <span id="telemetryStatus">READY • WAITING FOR TRIGGER</span>
      </div>
      <div class="inspector-content" id="inspectorContent">💡 Click one of the test buttons above to simulate live query triage through the pipeline!</div>
    </div>

    <!-- Architecture SVG -->
    <div class="diagram-wrapper">
      <object data="system_architecture.svg" type="image/svg+xml" style="width:100%; height:auto;"></object>
    </div>
  </div>

  <script>
    const scenarios = {
      emergency: {
        title: "🚨 SCENARIO: ACUTE EMERGENCY TRIGGERED",
        color: "#ef4444",
        status: "TRIAGED: EMERGENCY (CONFIDENCE: 98.4%)",
        steps: [
          "1. [User Input]: 'मेरे सीने में बहुत तेज़ दर्द हो रहा है, सांस नहीं आ रही' (Hindi Audio Voice Stream)",
          "2. [Mobile Client]: Audio captured via Flutter Speech-to-Text, attached GPS lat=12.9716, long=77.5946",
          "3. [Translation Layer]: Hindi identified ➔ Translated: 'I have severe chest pain and cannot breathe'",
          "4. [DistilBERT Classifier]: Evaluated with 98.4% Emergency Probability ➔ BRANCH: EMERGENCY PATH",
          "5. [DistilRoBERTa Emotion]: Computed Fear/Distress Metric = 0.94 / 1.0 (High Priority)",
          "6. [Overpass OSM Locator]: Identified 4 emergency facilities within 8 miles: 'Apollo Emergency Center' (2.1 km)",
          "7. [Gemini Flash Lite]: Category prompt with SOS directive guidance (rest upright, loosen clothes, do not walk)",
          "8. [Response Dispatch]: High-distress alert triggered, 108 Ambulance call FAB enabled, turn-by-turn map pre-staged."
        ]
      },
      medicine: {
        title: "💊 SCENARIO: GROUNDED MEDICINE QUERY (RAG)",
        color: "#10b981",
        status: "TRIAGED: MEDICINE QUERY (CONFIDENCE: 96.1%)",
        steps: [
          "1. [User Input]: 'Can I take paracetamol with ibuprofen for fever and body ache?' (English Text)",
          "2. [Mobile Client]: Packaged payload via Firebase Auth session token to Flask /chat",
          "3. [DistilBERT Classifier]: Evaluated with 96.1% Medicine Intent ➔ BRANCH: MEDICINE QUERY PATH",
          "4. [RAG Matching]: Matched dataset tokens across 699 verified records: Paracetamol (Acetaminophen) & Ibuprofen",
          "5. [Grounding Injection]: Uses, known side-effects, interactions, and hepatotoxicity caution injected into context",
          "6. [Gemini Flash Lite]: Grounded LLM response synthesizes verified indications; suppresses speculative dosages",
          "7. [Clinical Guardrail]: Appends mandatory medical disclaimer: 'Consult a physician or pharmacist before combining'."
        ]
      },
      appointment: {
        title: "📅 SCENARIO: ROUTINE CLINICAL APPOINTMENT",
        color: "#3b82f6",
        status: "TRIAGED: APPOINTMENT (CONFIDENCE: 94.7%)",
        steps: [
          "1. [User Input]: 'எனக்கு 2 வாரமாக கடுமையான முழங்கால் வலி இருக்கிறது' (Tamil Audio)",
          "2. [Translation Layer]: Tamil identified ➔ Translated: 'I have severe knee pain for 2 weeks'",
          "3. [DistilBERT Classifier]: 94.7% Appointment Intent ➔ BRANCH: APPOINTMENT PATH",
          "4. [Clinical Department Match]: Symptoms mapped to 'Orthopedics' specialty from 10 supported departments",
          "5. [Overpass OSM Locator]: Queried Orthopedic clinics & Community Health Centers within 8 miles",
          "6. [Gemini Flash Lite]: Formatted consultation briefing with prep instructions for doctor consultation",
          "7. [Response Dispatch]: Slot booking token generated, clinic opening hours and Google Maps route generated."
        ]
      }
    };

    function simulateRoute(route) {
      const inspector = document.getElementById("inspector");
      const status = document.getElementById("telemetryStatus");
      const content = document.getElementById("inspectorContent");
      const btns = document.querySelectorAll(".sim-btn");
      btns.forEach(b => b.classList.remove("active"));

      if (route === 'reset') {
        inspector.style.borderColor = "#1e293b";
        status.textContent = "READY • WAITING FOR TRIGGER";
        status.style.color = "#64748b";
        content.textContent = "💡 Click one of the test buttons above to simulate live query triage through the pipeline!";
        content.style.color = "#38bdf8";
        return;
      }

      const sc = scenarios[route];
      inspector.style.borderColor = sc.color;
      status.textContent = sc.status;
      status.style.color = sc.color;
      content.style.color = "#e2e8f0";
      
      let index = 0;
      content.textContent = `${sc.title}\n\n`;
      
      const timer = setInterval(() => {
        if (index < sc.steps.length) {
          content.textContent += sc.steps[index] + "\n";
          index++;
        } else {
          clearInterval(timer);
        }
      }, 120);
    }
  </script>
</body>
</html>
